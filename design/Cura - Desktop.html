<!DOCTYPE html>
<!-- PROVENANCE: ORIGINAL (bespoke to Cura) — prototype shell: CSS design tokens, fonts, script load order. Third-party (CDN): React 18, ReactDOM, Babel standalone, Google Fonts (Fraunces/Inter/JetBrains Mono). See PROVENANCE.md. -->
<html lang="en"><head>
<meta charset="UTF-8">
<title>Cura — Desktop</title>
<meta name="viewport" content="width=1440, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F4EFE6;
    --paper-2:#EBE3D4;
    --paper-3:#E2D7C2;
    --ink:#0E1A2B;
    --ink-soft:#2A3548;
    --ink-muted:#6B7280;
    --rule:#1A2438;
    --paper-rule:rgba(14,26,43,0.18);
    --paper-rule-soft:rgba(14,26,43,0.10);
    --accent:#B8331E;
    --accent-soft:#D9A074;
    --green:#1F5E3F;
    --bg-app:#1a1a1c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg-app);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .serif{font-family:'Fraunces',Georgia,serif;}
  .sans{font-family:'Inter',system-ui,sans-serif;}
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,monospace;}

  /* App layout */
  .stage{
    width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    overflow:hidden;
  }

  /* App canvas: paper background, scrollable */
  .app-root{
    height:100%;
    background:var(--paper);
    color:var(--ink);
    display:grid;
    grid-template-columns:240px 1fr;
    overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;
  }

  /* Sidebar */
  .sidebar{
    background:var(--paper-2);
    border-right:1px solid var(--paper-rule);
    display:flex;flex-direction:column;
    padding:24px 0 16px;
  }
  .brand{
    padding:0 24px 24px;
    display:flex;align-items:baseline;gap:8px;
    border-bottom:1px solid var(--paper-rule);
    margin-bottom:16px;
  }
  .brand-c{
    font-family:'Fraunces',serif;
    font-size:34px;
    font-weight:600;
    line-height:1;
    color:var(--ink);
  }
  .brand-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    align-self:flex-end;
    margin-bottom:4px;
  }
  .brand-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:0.22em;
    color:var(--ink-muted);
    text-transform:uppercase;
    margin-left:auto;
    align-self:flex-end;
    margin-bottom:6px;
  }
  .nav-section{
    padding:0 16px;
    margin-bottom:24px;
  }
  .nav-section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:0.22em;
    color:var(--ink-muted);
    text-transform:uppercase;
    padding:0 8px 8px;
  }
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;
    border-radius:6px;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:14px;font-weight:500;
    transition:background 0.15s;
    user-select:none;
  }
  .nav-item:hover{background:rgba(14,26,43,0.05);}
  .nav-item.active{
    background:var(--ink);
    color:var(--paper);
  }
  .nav-item.active .nav-shortcut{color:rgba(244,239,230,0.5);}
  .nav-icon{
    width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .nav-shortcut{
    margin-left:auto;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-muted);
  }

  /* Top bar */
  .topbar{
    height:64px;
    border-bottom:1px solid var(--paper-rule);
    display:flex;align-items:center;
    padding:0 32px;
    gap:24px;
    background:var(--paper);
    flex-shrink:0;
    position:relative;
    z-index:5;
  }
  .breadcrumb{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:0.2em;
    color:var(--ink-muted);
    text-transform:uppercase;
  }
  .topbar-search{
    flex:1;max-width:480px;
    height:36px;
    background:var(--paper-2);
    border:1px solid var(--paper-rule);
    border-radius:6px;
    display:flex;align-items:center;gap:10px;
    padding:0 14px;
    color:var(--ink-muted);
    font-size:13px;
    cursor:text;
  }
  .budget-chip{
    margin-left:auto;
    display:flex;align-items:center;gap:8px;
    background:var(--paper-2);
    border:1px solid var(--paper-rule);
    padding:7px 12px;
    border-radius:18px;
    font-size:12px;
    cursor:pointer;
  }
  .budget-chip .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--green);
  }
  .ask-cleo-btn{
    display:flex;align-items:center;gap:8px;
    background:var(--ink);
    color:var(--paper);
    padding:9px 16px;
    border-radius:6px;
    font-size:13px;font-weight:600;
    cursor:pointer;
    border:none;
    transition:transform 0.15s;
  }
  .ask-cleo-btn:hover{transform:translateY(-1px);}

  /* Main canvas */
  .main{
    display:flex;flex-direction:column;
    overflow:hidden;
    height:100%;
  }
  .scroll-area{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
  }

  /* Section headers */
  .section-tag{
    display:flex;align-items:baseline;gap:14px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:0.22em;
    color:var(--ink-muted);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .section-tag::before{
    content:'';width:24px;height:1px;background:var(--ink);
  }

  /* Buttons — weight on hover, press on click */
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 14px;
    border-radius:5px;
    font-size:13px;font-weight:500;
    cursor:pointer;
    border:1px solid var(--paper-rule);
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    transition:background .15s, transform .18s var(--ease-settle), box-shadow .18s var(--ease-settle);
  }
  .btn:hover{background:var(--paper-2);transform:translateY(-1px);box-shadow:0 3px 10px rgba(14,26,43,0.10);}
  .btn:active{transform:translateY(0);box-shadow:none;}
  .btn-ghost{border:none;background:transparent;}
  .btn-ghost:hover{background:var(--paper-2);}

  /* Cards / story cells — lift, ink underline, slow photo zoom */
  .story-card{
    cursor:pointer;
    transition:transform .22s var(--ease-settle);
  }
  .story-card:hover{transform:translateY(-2px);}
  .story-card img{transition:transform .6s var(--ease-settle);}
  .story-card:hover img{transform:scale(1.035);}
  .story-card h2,.story-card h3,.story-card h4{
    text-decoration:underline;text-decoration-color:transparent;
    text-decoration-thickness:1px;text-underline-offset:3px;
    transition:text-decoration-color .25s;
  }
  .story-card:hover h2,.story-card:hover h3,.story-card:hover h4{
    text-decoration-color:var(--ink);
  }

  /* Confidence pill */
  .conf-pill{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }
  .conf-bar{
    display:inline-flex;gap:2px;
  }
  .conf-bar i{
    width:5px;height:8px;background:var(--paper-3);
    display:block;
  }
  .conf-bar i.on{background:var(--green);}
  .conf-bar i.warn{background:#C8854A;}

  /* Source chip */
  .src-chip{
    display:inline-flex;align-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:0.16em;
    color:var(--ink-muted);
    text-transform:uppercase;
    border:1px solid var(--paper-rule);
    padding:3px 8px;
    border-radius:3px;
    background:var(--paper);
  }

  /* "Why am I seeing this" inline tag */
  .why-tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;
    color:var(--accent);
    text-decoration:underline;
    text-decoration-color:rgba(184,51,30,0.4);
    text-underline-offset:3px;
    cursor:help;
    font-style:italic;
  }

  /* Cleo slide-over */
  .cleo-overlay{
    position:absolute;
    inset:0;
    background:rgba(14,26,43,0.35);
    z-index:50;
    pointer-events:auto;
  }
  .cleo-panel{
    position:absolute;
    right:0;top:0;bottom:0;
    width:480px;
    background:var(--paper);
    border-left:1px solid var(--rule);
    box-shadow:-20px 0 60px rgba(14,26,43,0.2);
    z-index:60;
    transform:none;
    display:flex;flex-direction:column;
  }

  /* Newspaper-specific (Experience view) */
  .nps-rule-thick{border-top:3px double var(--ink);}
  .nps-rule{border-top:1px solid var(--ink);}
  .drop-cap::first-letter{
    font-family:'Fraunces',serif;
    font-size:72px;
    font-weight:600;
    float:left;
    line-height:0.85;
    margin:6px 8px 0 0;
    color:var(--accent);
  }

  /* Audio waveform */
  .waveform{
    display:flex;align-items:center;gap:2px;height:48px;
  }
  .waveform i{
    width:3px;background:var(--ink-muted);display:block;border-radius:2px;
    transition:height 0.12s ease;
  }
  .waveform i.played{background:var(--accent);}

  /* Source comparison columns */
  .compare-col{
    background:var(--paper);
    border:1px solid var(--paper-rule);
    padding:24px;
    display:flex;flex-direction:column;
  }

  /* Dark mode override */
  body.theme-dark{--bg-app:#0a0a0a;}
  .app-root.theme-dark{
    --paper:#13141a;
    --paper-2:#1c1d24;
    --paper-3:#262832;
    --ink:#F0EBE0;
    --ink-soft:#C9C3B5;
    --ink-muted:#7B7568;
    --rule:#3A3D48;
    --paper-rule:rgba(240,235,224,0.10);
    --paper-rule-soft:rgba(240,235,224,0.05);
  }

  /* Editorial scrollbars — thin, ink-tinted, no Windows chrome */
  .scroll-area::-webkit-scrollbar{width:10px;}
  .scroll-area::-webkit-scrollbar-track{background:transparent;}
  .scroll-area::-webkit-scrollbar-thumb{
    background:var(--paper-3);border-radius:6px;
    border:3px solid transparent;background-clip:content-box;
  }
  .scroll-area::-webkit-scrollbar-thumb:hover{background:var(--ink-muted);background-clip:content-box;}

  /* ── Motion language: settling print, not bouncy SaaS ─────────────── */
  :root{--ease-settle:cubic-bezier(.22,.7,.25,1);}
  @keyframes curaRise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .view-rise{animation:curaRise .34s var(--ease-settle) both;}
  .stagger>*{animation:curaRise .45s var(--ease-settle) both;}
  .stagger>*:nth-child(1){animation-delay:.04s;}
  .stagger>*:nth-child(2){animation-delay:.09s;}
  .stagger>*:nth-child(3){animation-delay:.14s;}
  .stagger>*:nth-child(4){animation-delay:.19s;}
  .stagger>*:nth-child(5){animation-delay:.24s;}
  .stagger>*:nth-child(6){animation-delay:.29s;}
  .stagger>*:nth-child(7){animation-delay:.34s;}
  .stagger>*:nth-child(8){animation-delay:.39s;}
  .stagger>*:nth-child(n+9){animation-delay:.44s;}

  /* Confidence bars fill in like set type */
  @keyframes curaConfIn{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .conf-bar i{transform-origin:bottom;animation:curaConfIn .4s var(--ease-settle) both;}
  .conf-bar i:nth-child(2){animation-delay:.05s;}
  .conf-bar i:nth-child(3){animation-delay:.10s;}
  .conf-bar i:nth-child(4){animation-delay:.15s;}
  .conf-bar i:nth-child(5){animation-delay:.20s;}

  /* Listen: the play button breathes while narrating */
  @keyframes curaPulse{
    0%{box-shadow:0 0 0 0 rgba(244,239,230,0.30);}
    70%{box-shadow:0 0 0 16px rgba(244,239,230,0);}
    100%{box-shadow:0 0 0 0 rgba(244,239,230,0);}
  }
  .cura-pulse{animation:curaPulse 2.4s ease-out infinite;}

  /* Finish details */
  ::selection{background:rgba(184,51,30,0.16);}
  .src-chip{transition:border-color .2s, color .2s;}
  .src-chip:hover{border-color:var(--ink-muted);color:var(--ink);}

  /* Motion is a courtesy, never a requirement */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }

  body.hide-tweaks .__tweaks_panel__{display:none !important;}
</style>
</head>

<div id="root"></div>
<div id="tweaks-root"></div>

<!-- React + Babel -->

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="components/chrome.jsx"></script>

</body></html>
