# The Cura Daily, published: rebuild the edition and deploy it to GitHub
# Pages as a fully static site. No server and no API key ship to visitors,
# so the public page cannot spend tokens — Cleo falls back to the scripted
# demo and on-demand briefing hides itself.
#
# One-time setup:
#   1. Repo Settings -> Pages -> Source: "GitHub Actions".
#   2. (Optional) Repo Settings -> Secrets -> Actions: add ANTHROPIC_API_KEY
#      to bake ONE Cleo editorial per build (the publisher's cost, ~cents);
#      without it the wire edition publishes.
#   3. The cron only fires on the default branch — merge this workflow to
#      main for the daily schedule; "Run workflow" works from any branch.

name: Daily edition

on:
  schedule:
    - cron: "0 22 * * *"   # 06:00 Singapore time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (light stack + full-article extraction)
        run: pip install -e ".[fulltext]"
      - name: Build tonight's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # --light: CI publishes the baseline stack (fast, no torch download);
        # --editorial bakes one pre-generated Cleo editorial when the secret
        # exists, and degrades to the wire edition when it doesn't.
        run: python -m cura export-site --out _site --light --no-store --editorial
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
