<!doctype html>
<meta charset="utf-8">
<title>Cura headline labelling</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 60px auto;
         padding: 0 16px; text-align: center; }
  #headline { font-size: 22px; font-family: Georgia, serif; min-height: 90px;
              margin: 30px 0; }
  button { padding: 12px 22px; margin: 0 6px; font-size: 15px; cursor: pointer;
           border-radius: 8px; border: 1px solid #999; background: #fff; }
  #neg { border-color: #a33; } #pos { border-color: #2a7; }
  .small { font-size: 12px; padding: 6px 12px; margin-top: 24px; }
  #progress { color: #666; margin-top: 28px; }
  #done { background: #1F5E3F; color: #fff; border: none; display: none;
          padding: 14px 28px; font-size: 16px; }
  kbd { background: #eee; border-radius: 3px; padding: 1px 5px; font-size: 12px; }
</style>
<h2>Label the headline's tone</h2>
<p>Keys: <kbd>1</kbd> negative &nbsp; <kbd>2</kbd> neutral &nbsp; <kbd>3</kbd> positive
&nbsp; <kbd>s</kbd> skip &nbsp; <kbd>b</kbd> back. Progress auto-saves in this browser.</p>
<div id="headline"></div>
<div>
  <button id="neg" onclick="mark('negative')">1 · negative</button>
  <button onclick="mark('neutral')">2 · neutral</button>
  <button id="pos" onclick="mark('positive')">3 · positive</button>
</div>
<div>
  <button class="small" onclick="mark('')">skip (blank)</button>
  <button class="small" onclick="back()">back</button>
  <button class="small" onclick="if(confirm('Clear all saved labels?')){localStorage.removeItem(KEY);location.reload()}">reset</button>
</div>
<p id="progress"></p>
<button id="done" onclick="finish()">Download labelled CSV</button>

const KEY = 'cura-headline-labels';
let labels = JSON.parse(localStorage.getItem(KEY) || '{}');
let i = ITEMS.findIndex(it => !(it.id in labels));
if (i < 0) i = ITEMS.length;
function render() {
  const done = Object.keys(labels).length;
  document.getElementById('progress').textContent =
    done + ' / ' + ITEMS.length + ' labelled';
  const fin = document.getElementById('done');
  if (i >= ITEMS.length) {
    document.getElementById('headline').textContent = 'All done — download below.';
    fin.style.display = 'inline-block';
  } else {
    document.getElementById('headline').textContent = '\u201C' + ITEMS[i].text + '\u201D';
    fin.style.display = done === ITEMS.length ? 'inline-block' : 'none';
  }
}
function mark(label) {
  if (i >= ITEMS.length) return;
  labels[ITEMS[i].id] = label;
  localStorage.setItem(KEY, JSON.stringify(labels));
  i++; render();
}
function back() { if (i > 0) { i--; delete labels[ITEMS[i].id];
  localStorage.setItem(KEY, JSON.stringify(labels)); render(); } }
document.addEventListener('keydown', e => {
  if (e.key === '1') mark('negative');
  else if (e.key === '2') mark('neutral');
  else if (e.key === '3') mark('positive');
  else if (e.key === 's') mark('');
  else if (e.key === 'b') back();
});
function esc(v) { return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function finish() {
  const rows = [['id','source','text','label']];
  for (const it of ITEMS) rows.push([it.id, esc(it.source), esc(it.text),
                                     labels[it.id] || '']);
  const blob = new Blob([rows.map(r => r.join(',')).join('\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '2026-08-02-stance-headlines-200.aaron.csv';
  a.click();
}
render();
</script>
